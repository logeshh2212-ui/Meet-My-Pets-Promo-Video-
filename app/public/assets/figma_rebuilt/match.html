<!doctype html>
<!-- "It's a Match!" screen, rebuilt for the launch film.
     Frame: 393 x 852 (iPhone 14/15 Pro, same as the Figma exports). Render at 4x.
     Text = the exact strings from the app's match_celebration_overlay.dart.
     Background = the real Figma Discover export, dimmed + softly blurred (as in the mock-up). -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600&display=block" rel="stylesheet">
<style>
  :root { --primary: #FF1744; --text-inverse: #FFFFFF; }
  html, body { margin: 0; width: 393px; height: 852px; overflow: hidden; background: #FFFAFA; }
  .frame { position: relative; width: 393px; height: 852px; overflow: hidden; }
  /* the real Discover screen underneath */
  .under { position: absolute; inset: 0; background: url("../figma/Discover%20page.png") center / 393px 852px no-repeat;
           filter: blur(5px) saturate(0.75); transform: scale(1.03); }
  /* dim veil */
  .veil { position: absolute; inset: 0; background: rgba(28, 24, 30, 0.50); }
  .center { position: absolute; left: 0; right: 0; top: 232px; display: flex; flex-direction: column; align-items: center; }
  .mark { width: 112px; height: 112px; filter: drop-shadow(0 10px 22px rgba(255, 23, 68, 0.35)) drop-shadow(0 0 2px rgba(255,255,255,0.35)); }
  h1 { margin: 26px 0 0; font: 700 34px/1.1 "Bricolage Grotesque", sans-serif; color: var(--text-inverse); letter-spacing: -0.2px;
       text-shadow: 0 2px 14px rgba(0,0,0,0.25); }
  p  { margin: 10px 0 0; font: 400 17px/1.3 "Nunito Sans", sans-serif; color: rgba(255,255,255,0.92); }
  .buttons { position: absolute; left: 24px; right: 24px; bottom: 132px; display: flex; flex-direction: column; gap: 14px; }
  .btn { height: 54px; border-radius: 27px; display: flex; align-items: center; justify-content: center;
         font: 600 18px/1 "Nunito Sans", sans-serif; letter-spacing: 0.1px; }
  .primary { background: var(--primary); color: #fff; box-shadow: 0 10px 24px rgba(255, 23, 68, 0.35); }
  .secondary { background: rgba(255,255,255,0.14); color: #fff; border: 1.5px solid rgba(255,255,255,0.75);
               backdrop-filter: blur(8px); }
</style>
</head>
<body>
<div class="frame">
  <div class="under"></div>
  <div class="veil"></div>
  <div class="center">
    <svg class="mark" viewBox="-0.25 0 36 36" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g0" x1="22.7168" y1="29.4851" x2="13.9509" y2="4.42046" gradientUnits="userSpaceOnUse"><stop stop-color="#FF1744"/><stop offset="0.5" stop-color="#FF7A00"/><stop offset="1" stop-color="#FFC107"/></linearGradient>
        <linearGradient id="g1" x1="12.7788" y1="29.4851" x2="21.5447" y2="4.42046" gradientUnits="userSpaceOnUse"><stop stop-color="#FF1744"/><stop offset="0.5" stop-color="#FF7A00"/><stop offset="1" stop-color="#FFC107"/></linearGradient>
      </defs>
      <path d="M21.8434 14.0068C25.1791 20.9084 24.5 28.4559 20.3268 30.8646C16.1535 33.2733 10.0663 29.631 6.73063 22.7294C3.39499 15.8278 4.07403 8.28028 8.24732 5.8716C12.4206 3.46291 18.5078 7.10515 21.8434 14.0068ZM7.65702 22.1947C10.5837 28.2502 15.9246 31.446 19.5863 29.3326C23.248 27.2192 23.8438 20.597 20.9171 14.5415C17.9903 8.48594 12.6494 5.29023 8.98776 7.40362C5.32611 9.51701 4.73031 16.1392 7.65702 22.1947Z" fill="url(#g0)"/>
      <path d="M13.6522 14.0068C10.3165 20.9084 10.9956 28.4559 15.1689 30.8646C19.3421 33.2733 25.4293 29.631 28.765 22.7294C32.1006 15.8278 31.4216 8.28028 27.2483 5.8716C23.075 3.46291 16.9878 7.10515 13.6522 14.0068ZM27.8386 22.1947C24.9119 28.2502 19.571 31.446 15.9093 29.3326C12.2476 27.2192 11.6518 20.597 14.5786 14.5415C17.5053 8.48594 22.8462 5.29023 26.5078 7.40362C30.1695 9.51701 30.7653 16.1392 27.8386 22.1947Z" fill="url(#g1)"/>
    </svg>
    <h1>It’s a Match!</h1>
    <p>Lily liked you back.</p>
  </div>
  <div class="buttons">
    <div class="btn primary">Chat Now</div>
    <div class="btn secondary">Continue Discovering</div>
  </div>
</div>
</body>
</html>
